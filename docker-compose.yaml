# Container log rotation. Docker's default json-file driver keeps every line a container writes
# until the container is recreated, with no size limit, so a chatty service can fill the droplet's
# disk over time. Every service below merges this in: at most 3 files of 10 MB each (30 MB) per
# service. This bounds storage, not age: a low-traffic service can hold weeks of lines inside
# its cap. It takes effect when a container is (re)created, i.e. at the next deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── Data layer ───────────────────────────────────────────────────────────────

  db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: fragrance
      POSTGRES_USER: fragrance
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrance -d fragrance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Search ───────────────────────────────────────────────────────────────────

  searxng:
    logging: *default-logging
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    # No ports: intentionally unreachable from outside Docker — backend calls it
    # over the internal network at http://searxng:8080
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--header=X-Real-IP:127.0.0.1", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - public

  # ─── Backend ──────────────────────────────────────────────────────────────────

  backend:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /app/.venv/bin/python -m gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file: backend/.env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Single source of truth with nginx's admin location below — both derive from the same
      # root .env value so they can never drift apart. Overrides whatever backend/.env sets.
      - DJANGO_ADMIN_URL=${ADMIN_URL_PATH}
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      # backend now makes real outbound LLM API calls itself (the AIModelConfig
      # admin "Run conformance check now" button runs inside this gunicorn
      # process, not celery-worker) — needs the same public egress celery-worker
      # already has, or every such click fails on connectivity alone.
      - public

  celery-worker:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /app/.venv/bin/python -m celery -A config worker -l info --concurrency 1
    # Compose's default stop grace is 10s. A recommendation run takes minutes, and the worker acks
    # early (task_acks_late is off), so a recreate that SIGKILLs it mid-run loses the task AND strands
    # its RecommendationRun row in `running`. 120s lets a short run finish on SIGTERM (warm shutdown).
    # A stranded row is also bounded by the in-flight age limit and the `reap_stale_runs` task.
    stop_grace_period: 120s
    env_file: backend/.env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DJANGO_ADMIN_URL=${ADMIN_URL_PATH}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - internal
      - public

  celery-beat:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # DatabaseScheduler reads PeriodicTask rows created per-user via the API
    command: >
      /app/.venv/bin/python -m celery -A config beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: backend/.env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DJANGO_ADMIN_URL=${ADMIN_URL_PATH}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: node .output/server/index.mjs
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://fragrances.supermanzer.io/api/v1}
      PORT: 3000
    networks:
      - internal

  # ─── Reverse proxy ────────────────────────────────────────────────────────────

  nginx:
    logging: *default-logging
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ADMIN_URL_PATH=${ADMIN_URL_PATH}
      # Scopes the stock image's envsubst-on-templates entrypoint to this one variable only —
      # nginx's own runtime $variables ($remote_addr, $scheme, etc.) must never be substituted.
      - NGINX_ENVSUBST_FILTER=^ADMIN_URL_PATH$
      # The stock entrypoint's default output dir is /etc/nginx/conf.d (verified live against
      # this exact image — NOT /etc/nginx/nginx.conf as originally assumed), which our rendered
      # full config (its own events{}/http{} blocks) can't be `include`d into safely. Point it
      # straight at /etc/nginx so the rendered file becomes nginx.conf itself.
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/admin_allowlist.d:/etc/nginx/admin_allowlist.d:ro
      - static_files:/app/staticfiles:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - public


volumes:
  postgres_data:
  static_files:

networks:
  internal:
    driver: bridge
    internal: true   # no direct internet access; nginx bridges to public
  public:
    driver: bridge
