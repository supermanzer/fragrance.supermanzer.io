<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Your account email was restored</title></head>
<body style="margin: 0; padding: 24px; background-color: #f5f5f0; font-family: Georgia, 'Times New Roman', serif; color: #444444; font-size: 16px; line-height: 1.7;">
  <div style="max-width: 560px; margin: 0 auto; background-color: #ffffff; padding: 32px 36px;">
    <p>Hi {{ username }},</p>
    <p>The email address on your Fragrances account has been restored to this one, and all sessions on the account were signed out.</p>
    <p>Please <a href="{{ forgot_password_url }}">reset your password now</a>, in case someone else has access.</p>
    <p>If you need help, contact us at <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</p>
    <p>&mdash; Fragrances</p>
  </div>
</body>
</html>
