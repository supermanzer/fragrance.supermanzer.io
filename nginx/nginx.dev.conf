events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        location /static/ {
            alias /app/staticfiles/;
        }

        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            client_max_body_size 2m;
        }

        # Fixed literal, not templated (dev doesn't need path secrecy — see the admin-hardening
        # plan's Finding 9). Must match DJANGO_ADMIN_URL as set for backend/celery-worker/
        # celery-beat in docker-compose.override.yaml, which is pinned to the same value.
        # Not internet-exposed, but scoped to private ranges anyway: this closes off "reachable
        # by anyone else on the same LAN/coffee-shop network via this nginx route" as a distinct
        # exposure — it does NOT close the separate, pre-existing gap that backend's 8000:8000
        # port is published on 0.0.0.0 with no gate at all, bypassing nginx entirely.
        location /dev-admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            # $http_host (verbatim client Host, port included), NOT $host (nginx-normalized,
            # strips the port) — dev listens on the non-default port 8181, and Django's CSRF
            # Origin check compares request.get_host() (reflects whatever Host nginx forwards)
            # against the browser's Origin header (which always includes a non-default port).
            # $host here would silently make every admin-login POST through nginx fail CSRF.
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass         $frontend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
